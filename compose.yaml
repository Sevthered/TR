version: '3.8'

services:
  db:
    image: docker.io/library/postgres:17
    restart: always
    container_name: postgresql
    volumes:
      - postgres_data:/var/lib/postgresql
    environment:
      - DATABASE_HOST=127.0.0.1
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      # Bound to loopback: publishing on 0.0.0.0 exposes the database to every
      # interface, bypassing all application-level authorization.
      - "127.0.0.1:5432:5432"
volumes:
  postgres_data:
    driver: local
