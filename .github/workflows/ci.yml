name: CI

on:
  push:
    branches: [main, ai-assisted-ui-overhaul]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: my_database
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: ci-not-a-real-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-only-key-not-used-anywhere-else
      POSTGRES_DB: my_database
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ci-not-a-real-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      DEBUG: 'False'
      ALLOWED_HOSTS: 127.0.0.1,localhost

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run migrations
        run: python manage.py migrate

      - name: Rate-limit counter store
        run: python manage.py createcachetable

      # The access-control suite. Catches the class of bug that shipped here:
      # endpoints with no authorization, and denials returned as HTTP 200.
      - name: Tests
        # The test client speaks plain HTTP, so the DEBUG=False redirect would
        # 301 every request before it reached a view. Overridden here only --
        # the deployment check below still sees the redirect enabled.
        env:
          SECURE_SSL_REDIRECT: 'False'
        run: python manage.py test mainapp -v 2

      # Independently re-checks DEBUG, ALLOWED_HOSTS, secure cookies, HSTS and
      # the SECRET_KEY prefix.
      #
      # --fail-level WARNING, not ERROR. Every Django deployment security check
      # is a Warning; only two checks about malformed *values* are Errors. At
      # ERROR this step printed W004/W008/W009/W012/W016/W018 and still exited
      # 0 -- verified with DEBUG=True and a five-character SECRET_KEY. It has
      # never been able to fail, and no test in the suite asserts on any
      # security setting, so nothing else covered settings.py.
      #
      # The two warnings that really are deliberate (HSTS includeSubDomains and
      # preload) are now named in SILENCED_SYSTEM_CHECKS, where they document
      # themselves, instead of being waived wholesale by the fail level.
      - name: Deployment checks
        run: python manage.py check --deploy --fail-level WARNING

      - name: Static files build
        run: python manage.py collectstatic --noinput
